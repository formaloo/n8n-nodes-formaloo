name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel in-progress runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Official n8n review lint: strict cloud ESLint config from @n8n/node-cli,
      # including community-node rules, and warnings fail the job.
      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
